<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Stack'd v0.99</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // v0.81 pre-paint boot script — must run before the stylesheets parse.
      // 1) Applies the persisted theme synchronously so dark-theme users never
      //    get a white first paint (Store.applyTheme confirms it at boot).
      //    StackdDB JSON-stringifies values, hence the JSON.parse.
      // 2) Flags native runs (html.native-boot) so the WEB splash never paints
      //    there — the native splash is held by @capacitor/splash-screen until
      //    main.js reports the app ready (launchAutoHide: false).
      // 3) Safety net: if boot JS ever fails before main.js can hide the held
      //    native splash, force-hide it so the app cannot hang on the logo.
      (function () {
        try {
          var pref = null;
          try { pref = JSON.parse(localStorage.getItem('stackd_v1_theme')); } catch (e) { /* unreadable */ }
          var dark = pref === 'dark' || ((pref === null || pref === 'system') &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          }
          if (window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' &&
              window.Capacitor.isNativePlatform()) {
            document.documentElement.classList.add('native-boot');
          }
          setTimeout(function () {
            try {
              var sp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen;
              if (sp && sp.hide) sp.hide();
            } catch (e) { /* nothing to hide */ }
          }, 8000);
        } catch (e) { /* never block boot */ }
      })();
    </script>
    <link rel="stylesheet" href="src/styles/fonts.css" />
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/variables.css" />
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        padding-top: var(--safe-top);
        padding-bottom: var(--safe-bottom);
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.5s ease;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash-logo {
        width: 120px;
        height: 96px;
      }
      #splash-title {
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 2.2rem;
        color: #111111;
        letter-spacing: -0.02em;
      }
      /* v0.81: theme-aware splash — dark users used to get a white splash
         snapping to a dark app at fade end. invert(1) flips the monochrome
         logo; the wordmark recolors explicitly. */
      :root[data-theme="dark"] #splash-screen { background: #0b0f19; }
      :root[data-theme="dark"] #splash-title { color: #f8fafc; }
      :root[data-theme="dark"] #splash-logo { filter: invert(1); }
      /* v0.81: on native the held NATIVE splash is the only splash — the web
         one never paints (single continuous splash, no logo jump). */
      html.native-boot #splash-screen { display: none; }
    </style>
    <!-- v0.81: lucide is served from the local snapshot (same 0.400.0 the
         EMERGENCY_ICONS fallback tracks) and jspdf/autotable are lazy-loaded
         by export.js on first PDF export — the three parser-blocking CDN
         requests that delayed first paint on device are gone. -->
    <script defer src="src/libs/lucide.min.js"></script>
    <script defer src="src/libs/chart.js"></script>
  </head>
  <body>
    <!-- Splash Screen Overlay -->
    <div id="splash-screen" role="presentation" aria-hidden="true">
      <svg id="splash-logo" viewBox="0 0 130 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Bottom layer -->
        <polygon points="10,70 45,52 80,70 45,88" fill="#111111"/>
        <!-- Middle layer -->
        <polygon points="10,50 45,32 80,50 45,68" fill="#111111" stroke="#ffffff" stroke-width="5" stroke-linejoin="miter"/>
        <!-- Top layer -->
        <polygon points="10,30 45,12 80,30 45,48" fill="#111111" stroke="#ffffff" stroke-width="5" stroke-linejoin="miter"/>
        
        <!-- Arrow shaft -->
        <rect x="94" y="40" width="12" height="48" fill="#111111"/>
        <!-- Arrow head -->
        <polygon points="80,40 100,10 120,40" fill="#111111"/>
      </svg>
      <span id="splash-title">Stack'd</span>
    </div>

    <div id="app">
      <!-- Main view container (router outlet) -->
      <main id="router-view" class="view-container"></main>
      
      <!-- Bottom Navigation -->
      <nav class="bottom-nav" id="bottom-nav">
        <!-- Will be injected by BottomNav component -->
      </nav>
      
      <!-- Global Modal Container -->
      <div id="modal-container"></div>
    </div>
