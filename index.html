<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Stack'd v0.73</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/variables.css" />
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        padding-top: var(--safe-top);
        padding-bottom: var(--safe-bottom);
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.5s ease;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash-logo {
        width: 120px;
        height: 96px;
      }
      #splash-title {
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 2.2rem;
        color: #111111;
        letter-spacing: -0.02em;
      }
    </style>
    <script src="https://unpkg.com/lucide@0.400.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>



    <script defer src="src/libs/chart.js"></script>
  </head>
  <body>
    <!-- Splash Screen Overlay -->
    <div id="splash-screen" role="presentation" aria-hidden="true">
      <svg id="splash-logo" viewBox="0 0 130 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Bottom layer -->
        <polygon points="10,70 45,52 80,70 45,88" fill="#111111"/>
        <!-- Middle layer -->
        <polygon points="10,50 45,32 80,50 45,68" fill="#111111" stroke="#ffffff" stroke-width="5" stroke-linejoin="miter"/>
        <!-- Top layer -->
        <polygon points="10,30 45,12 80,30 45,48" fill="#111111" stroke="#ffffff" stroke-width="5" stroke-linejoin="miter"/>
        
        <!-- Arrow shaft -->
        <rect x="94" y="40" width="12" height="48" fill="#111111"/>
        <!-- Arrow head -->
        <polygon points="80,40 100,10 120,40" fill="#111111"/>
      </svg>
      <span id="splash-title">Stack'd</span>
    </div>

    <div id="app">
      <!-- Main view container (router outlet) -->
      <main id="router-view" class="view-container"></main>
      
      <!-- Bottom Navigation -->
      <nav class="bottom-nav" id="bottom-nav">
        <!-- Will be injected by BottomNav component -->
      </nav>
      
      <!-- Global Modal Container -->
      <div id="modal-container"></div>
    </div>
    
    <script defer src="src/db.js?v=13"></script>
    <script defer src="src/utils/scroll.js?v=13"></script>
    <script defer src="src/utils/keyboard.js?v=13"></script>
    <script defer src="src/loan-engine.js?v=1"></script>
    <script defer src="src/store.js?v=25"></script>
    <script defer src="src/components.js?v=25"></script>
    <script defer src="src/widgets.js?v=6"></script>
    <script defer src="src/views.js?v=34"></script>
    <script defer src="src/router.js?v=14"></script>
    <script defer src="src/export.js?v=15"></script>
    <script defer src="src/import.js?v=15"></script>
    <script defer src="src/main.js?v=18"></script>
  </body>
</html>
