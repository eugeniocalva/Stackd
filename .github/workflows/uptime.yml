# 1.3.0 (GAP-3): a basic uptime check. Every 30 minutes it asks the website
# and the staging broker for a 200; a failed run makes GitHub e-mail the
# owner. GitHub runs schedules on a best-effort basis (a run can be late or
# skipped) and disables them after 60 days without commits, so this is a
# floor, not a pager: before the production broker goes live, add
# https://api.stackdplatform.com/healthz below AND set up an external
# monitor (launch-plan O-30).
name: Uptime

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every endpoint answers 200
        run: |
          fail=0
          for url in \
            https://stackdplatform.com/ \
            https://api-staging.stackdplatform.com/healthz
          do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 "$url" || echo 000)
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url answered $code"
              fail=1
            fi
          done
          exit $fail
